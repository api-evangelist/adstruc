aid: adstruc
name: ADstruc
description: ADstruc is a technology platform for the out-of-home (OOH) advertising industry, founded
  in 2010 in New York City by John Laramie and Sam Herbert. It provides workflow-automation software,
  including its Drive product, that lets brands and agencies plan, buy, and manage traditional and
  digital out-of-home media campaigns, and gives OOH operators cloud-based tools to manage and promote
  their inventory and interact with clients in real time. ADstruc was acquired by Vistar Media in April
  2024 (from PJX Media) and the product is now sold as "Adstruc by Vistar Media" as part of that
  company's out-of-home advertising stack. ADstruc publishes no public developer API, portal, SDK or
  machine-readable contract of its own. The www.adstruc.com site is now a splash page whose only live
  routes are / and /login, and every developer and /.well-known/ path returns 404. The SSP and DSP APIs at
  developers.vistarmedia.com belong to Vistar Media, name Vistar hosts, and never mention ADstruc,
  so they are profiled under Vistar Media rather than credited here.
