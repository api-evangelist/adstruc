aid: adstruc
name: ADstruc
description: ADstruc is a technology platform for the out-of-home (OOH) advertising industry, founded
  in 2010 in New York City by John Laramie and Sam Herbert. It provides workflow-automation software,
  including its Drive product, that lets brands and agencies plan, buy, and manage traditional and
  digital out-of-home media campaigns, and gives OOH operators cloud-based tools to manage and promote
  their inventory and interact with clients in real time. ADstruc was acquired by Vistar Media in April
  2024 and now operates as part of its programmatic out-of-home advertising stack. No public developer
  API or documentation surface has been identified for ADstruc at this time.
